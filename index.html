<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>多终端课堂学习平台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>多终端课堂学习平台</h1>
      <p>支持学生课前预习、课中课件学习与课后作业提交</p>
    </header>

    <main class="container">
      <section id="auth-section" class="card auth-card">
        <div class="tabs">
          <button class="tab active" data-tab="login">登录</button>
          <button class="tab" data-tab="register">注册</button>
        </div>

        <form id="login-form" class="form active" autocomplete="on">
          <h2>账号登录</h2>
          <label>
            用户名
            <input type="text" id="login-username" required />
          </label>
          <label>
            密码
            <input type="password" id="login-password" required />
          </label>
          <button type="submit">登录</button>
        </form>

        <form id="register-form" class="form" autocomplete="on">
          <h2>新用户注册</h2>
          <label>
            用户名
            <input type="text" id="register-username" required minlength="3" />
          </label>
          <label>
            密码
            <input type="password" id="register-password" required minlength="6" />
          </label>
          <label>
            身份
            <select id="register-role" required>
              <option value="student">学生</option>
              <option value="teacher">老师</option>
            </select>
          </label>
          <button type="submit">注册</button>
        </form>
      </section>

      <section id="dashboard" class="hidden">
        <div class="card topbar">
          <div>
            <h2 id="welcome-text"></h2>
            <p id="role-text"></p>
          </div>
          <button id="logout-btn" class="danger">退出登录</button>
        </div>

        <div id="teacher-panel" class="panel hidden">
          <article class="card">
            <h3>老师上传学习资料</h3>
            <form id="upload-form" class="form-inline">
              <label>
                资料类型
                <select id="material-type" required>
                  <option value="preview">课前预习</option>
                  <option value="ppt">课上 PPT</option>
                  <option value="homework">课后作业</option>
                </select>
              </label>
              <label>
                标题
                <input type="text" id="material-title" required />
              </label>
              <label>
                内容/链接
                <textarea id="material-content" required placeholder="可填写描述、网盘链接、题目要求等"></textarea>
              </label>
              <button type="submit">上传资料</button>
            </form>
          </article>
        </div>

        <div id="student-panel" class="panel hidden">
          <article class="card">
            <h3>学生学习中心</h3>
            <p>请根据学习进度查看老师发布的内容：</p>
          </article>
        </div>

        <div class="grid">
          <article class="card">
            <h3>课前预习</h3>
            <ul id="preview-list" class="material-list"></ul>
          </article>

          <article class="card">
            <h3>课上 PPT</h3>
            <ul id="ppt-list" class="material-list"></ul>
          </article>

          <article class="card">
            <h3>课后作业</h3>
            <ul id="homework-list" class="material-list"></ul>
          </article>
        </div>
      </section>
    </main>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
  </body>
</html>
